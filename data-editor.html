<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagesbericht Editor - Live Vorschau</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#005a2d",
              "background-light": "#f0f2f5",
              "background-dark": "#1a1a1a",
              "surface-light": "#ffffff",
              "surface-dark": "#2a2a2a",
              "text-light-primary": "#212529",
              "text-dark-primary": "#e9ecef",
              "text-light-secondary": "#6c757d",
              "text-dark-secondary": "#adb5bd",
              "border-light": "#dee2e6",
              "border-dark": "#495057",
            },
            fontFamily: {
              sans: ["Open Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
            },
          },
        },
      };
    </script>
    <style>
        .progress-bar {
            height: 100%;
            background-color: #8cc63f;
            transition: width 0.3s ease-in-out;
        }
        .task-draggable {
            cursor: move;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="font-sans bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary">
    <div class="fixed top-4 right-4 z-50 space-x-2">
        <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors" onclick="toggleMode()" id="modeBtn">✏️ Bearbeiten</button>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors" onclick="exportConfig()">💾 Konfig. exportieren</button>
        <button class="bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-600 transition-colors" onclick="exportToOutlook()">📧 Als E-Mail exportieren</button>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-6 md:p-8">
        <header class="text-center mb-8 pb-4 border-b border-border-light dark:border-border-dark">
            <img alt="Minerva Biolabs Logo" class="h-12 w-auto mx-auto mb-4" src="https://minerva-biolabs.com/img/mb_logo.svg"/>
            <h1 class="text-xl font-semibold text-text-light-primary dark:text-text-dark-primary">Täglicher Arbeitsbericht</h1>
            <p class="text-lg text-text-light-secondary dark:text-text-dark-secondary" id="reportDate">Heute</p>
        </header>

        <section class="mb-8">
            <h2 class="text-xl font-bold mb-4 pb-2 border-b border-border-light dark:border-border-dark flex items-center">
                <span class="material-icons mr-2 text-primary">analytics</span>
                Prozess-Übersicht
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="totalProducts">0</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Aktive Prozesse</div>
                </div>
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="completedTasks">0</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Abgeschlossene Prozesse</div>
                </div>
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="totalTasks">0</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Gesamt Aufgaben</div>
                </div>
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="avgProgress">0%</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Ø Fortschritt</div>
                </div>
            </div>
        </section>

        <main>
            <section class="mb-8">
                <h2 class="text-xl font-bold mb-4 pb-2 border-b border-border-light dark:border-border-dark flex items-center">
                    <span class="material-icons mr-2 text-orange-500">settings</span>
                    Prozessfortschritt
                </h2>
                <div id="products-container"></div>
                
                <div class="text-center mt-6" id="addProductSection" style="display: none;">
                    <div class="flex justify-center items-center space-x-4">
                        <select id="templateSelector" class="border border-border-light rounded px-4 py-3">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                        <button class="bg-primary text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors" onclick="addProductFromTemplate()">
                            <span class="material-icons mr-2">add</span>Produkt aus Vorlage
                        </button>
                        <button class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition-colors" onclick="addProduct()">
                            <span class="material-icons mr-2">note_add</span>Leeres Produkt
                        </button>
                    </div>
                </div>
            </section>
            <section class="mt-8">
                <h2 class="text-xl font-bold mb-4 pb-2 border-b border-border-light dark:border-border-dark flex items-center">
                    <span class="material-icons mr-2 text-green-500">check_circle</span>
                    Abgeschlossene Prozesse
                </h2>
                <div id="completed-products-container"></div>
            </section>
        </main>


    </div>

    <div id="task-sidebar" class="fixed top-0 right-0 h-full w-64 bg-white dark:bg-gray-800 shadow-lg p-4 transform translate-x-full transition-transform duration-300 ease-in-out" style="display: none;">
        <h3 class="text-lg font-semibold mb-4">Aufgaben-Vorschläge</h3>
        <div id="task-suggestions-container" class="space-y-2">
            <!-- Suggestions will be populated by JavaScript -->
        </div>
    </div>

        let activeProductForSuggestions = null;

        const suggestedTasks = [
            "PCR-Mix", "Internal Control", "Positive Control", "Wasser", "Qualitätskontrolle", "Labeling", "Packing",
            "Dokumente schicki + Freigabe", "Abgabe Lager (Prozessende)", "Herstellung", "Abfüllung"
        ];

        function calculateProgress(tasks) {
            if (tasks.length === 0) return 0;
            const completed = tasks.filter(task => task.status === 'completed').length;
            return Math.round((completed / tasks.length) * 100);
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'completed': return 'check_circle';
                case 'in-progress': return 'schedule';
                case 'pending': return 'radio_button_unchecked';
                default: return 'radio_button_unchecked';
            }
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'completed': return 'text-primary';
                case 'in-progress': return 'text-yellow-500';
                case 'pending': return 'text-text-light-secondary dark:text-text-dark-secondary';
                default: return 'text-text-light-secondary dark:text-text-dark-secondary';
            }
        }

        function updateStats() {
            const activeProducts = products.filter(p => calculateProgress(p.tasks) < 100).length;
            const completedProducts = products.length - activeProducts;

            const totalTasks = products.reduce((sum, product) => sum + product.tasks.length, 0);
            const avgProgress = products.length > 0 ? Math.round(products.reduce((sum, product) =>
                sum + calculateProgress(product.tasks), 0) / products.length) : 0;
            
            document.getElementById('totalProducts').textContent = activeProducts;
            document.getElementById('completedTasks').textContent = completedProducts;
            document.getElementById('totalTasks').textContent = totalTasks;
            document.getElementById('avgProgress').textContent = avgProgress + '%';
        }

        function initSortable() {
            if (!editMode) return;
            products.forEach((product, productIndex) => {
                const el = document.getElementById(`tasks-container-${productIndex}`);
                new Sortable(el, {
                    animation: 150,
                    handle: '.task-draggable',
                    onEnd: function (evt) {
                        const itemEl = evt.item;
                        const oldIndex = parseInt(evt.oldIndex);
                        const newIndex = parseInt(evt.newIndex);
                        const movedItem = products[productIndex].tasks.splice(oldIndex, 1)[0];
                        products[productIndex].tasks.splice(newIndex, 0, movedItem);
                        renderProducts();
                    },
                });
            });
        }

        function renderProducts() {
            const activeProductsContainer = document.getElementById('products-container');
            const completedProductsContainer = document.getElementById('completed-products-container');

            activeProductsContainer.innerHTML = '';
            completedProductsContainer.innerHTML = '';

            products.forEach((product, productIndex) => {
                const progress = calculateProgress(product.tasks);
                const isCompleted = progress === 100;
                const icon = isCompleted ? '😴' : product.icon;

                const productHtml = `
                    <div class="bg-surface-light dark:bg-surface-dark p-6 rounded-lg border border-border-light dark:border-border-dark shadow-sm mb-6 ${editMode && !isCompleted ? 'ring-2 ring-primary ring-opacity-50' : ''}">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                ${editMode ? `<input class="w-12 h-8 text-center text-xl border border-border-light rounded" value="${product.icon}" onchange="updateProduct(${productIndex}, 'icon', this.value)">` : `<span class="text-2xl">${icon}</span>`}
                                ${editMode ? `<input class="font-semibold text-lg bg-transparent border-b border-primary" value="${product.name}" onchange="updateProduct(${productIndex}, 'name', this.value)">` : `<h3 class="font-semibold text-lg">${product.name}</h3>`}
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-text-light-secondary dark:text-text-dark-secondary">
                                    Chargennummer: ${editMode ? `<input class="w-20 text-xs bg-transparent border-b border-primary" value="${product.chargennummer}" onchange="updateProduct(${productIndex}, 'chargennummer', this.value)">` : product.chargennummer}
                                </div>
                                <span class="text-sm font-bold text-primary">${progress}%</span>
                                <div class="text-xs text-text-light-secondary dark:text-text-dark-secondary">
                                    Lieferdatum: ${editMode ? `<input class="w-20 text-xs bg-transparent border-b border-primary" value="${product.eta}" onchange="updateProduct(${productIndex}, 'eta', this.value)">` : product.eta}
                                </div>
                            </div>
                        </div>
                        
                        <div class="w-full bg-border-light dark:bg-border-dark rounded-full h-2.5 mb-4">
                            <div class="progress-bar h-2.5 rounded-full" style="width: ${progress}%"></div>
                        </div>
                        
                        <div class="space-y-1" id="tasks-container-${productIndex}">
                            ${product.tasks.map((task, taskIndex) => `
                                <div class="flex items-start p-2 bg-background-light dark:bg-background-dark rounded border border-border-light dark:border-border-dark ${editMode ? 'ring-1 ring-primary ring-opacity-30 task-draggable' : ''} ${task.status === 'pending' && !editMode ? 'opacity-60' : ''}" data-task-id="${taskIndex}">
                                    <span class="material-icons ${getStatusClass(task.status)} mr-2 mt-0.5 text-sm">${getStatusIcon(task.status)}</span>
                                    <div class="flex-1">
                                        ${editMode ? `<input class="font-medium text-sm w-full bg-transparent border-b border-primary mb-1" value="${task.title}" onchange="updateTask(${productIndex}, ${taskIndex}, 'title', this.value)">` : `<p class="font-medium text-sm ${task.status === 'pending' ? 'text-gray-500' : ''}">${task.title}</p>`}
                                        ${task.description && task.description.trim() !== '' && task.description !== 'Beschreibung' && !editMode ? `<p class="text-xs text-text-light-secondary dark:text-text-dark-secondary ${task.status === 'pending' ? 'text-gray-400' : ''}">${task.description}</p>` : ''}
                                        ${editMode ? `<input class="text-xs text-text-light-secondary dark:text-text-dark-secondary w-full bg-transparent border-b border-gray-300" value="${task.description || ''}" onchange="updateTask(${productIndex}, ${taskIndex}, 'description', this.value)" placeholder="Beschreibung (optional)">` : ''}

                                            <div class="mt-2 flex space-x-2">
                                                <button class="px-2 py-1 text-xs rounded ${task.status === 'pending' ? 'bg-gray-500 text-white' : 'bg-gray-200'}" onclick="updateTask(${productIndex}, ${taskIndex}, 'status', 'pending')">Geplant</button>
                                                <button class="px-2 py-1 text-xs rounded ${task.status === 'in-progress' ? 'bg-yellow-500 text-white' : 'bg-yellow-100'}" onclick="updateTask(${productIndex}, ${taskIndex}, 'status', 'in-progress')">In Arbeit</button>
                                                <button class="px-2 py-1 text-xs rounded ${task.status === 'completed' ? 'bg-green-500 text-white' : 'bg-green-100'}" onclick="updateTask(${productIndex}, ${taskIndex}, 'status', 'completed')">Fertig</button>
                                            </div>
                                        ` : ''}
                                    </div>
                                    ${editMode ? `
                                        <button class="ml-2 text-red-500 hover:text-red-700" onclick="deleteTask(${productIndex}, ${taskIndex})">
                                            <span class="material-icons text-sm">delete</span>
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                            ${editMode ? `
                                <div class="flex space-x-2 mt-4">
                                    <button class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-green-600" onclick="addTask(${productIndex})">
                                        <span class="material-icons text-sm mr-1">add</span>Aufgabe
                                    </button>
                                    <button class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600" onclick="openTaskSuggestions(${productIndex})">
                                        <span class="material-icons text-sm mr-1">lightbulb</span>Vorschläge
                                    </button>
                                    <button class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600" onclick="deleteProduct(${productIndex})">
                                        <span class="material-icons text-sm mr-1">delete</span>Produkt löschen
                                    </button>
                                </div>
                            ` : ''}

                    </div>
                `;

                if (isCompleted) {
                    completedProductsContainer.innerHTML += productHtml;
                } else {
                    activeProductsContainer.innerHTML += productHtml;
                }
            });
            
            updateStats();
            setTimeout(initSortable, 0);
        }

        function toggleMode() {
            editMode = !editMode;
            document.getElementById('modeBtn').textContent = editMode ? '👁️ Vorschau' : '✏️ Bearbeiten';
            document.getElementById('addProductSection').style.display = editMode ? 'block' : 'none';
            const sidebar = document.getElementById('task-sidebar');
            if (editMode) {
                sidebar.style.display = 'block';
                setTimeout(() => sidebar.classList.remove('translate-x-full'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                setTimeout(() => sidebar.style.display = 'none', 300);
            }
            renderProducts();
        }

        function renderTaskSuggestions() {
            const container = document.getElementById('task-suggestions-container');
            container.innerHTML = suggestedTasks.map(taskTitle => `
                <button class="w-full text-left bg-gray-200 dark:bg-gray-700 p-2 rounded hover:bg-primary hover:text-white" onclick="addTaskFromSuggestion('${taskTitle}')">
                    ${taskTitle}
                </button>
            `).join('');
        }

        function openTaskSuggestions(productIndex) {
            activeProductForSuggestions = productIndex;
            renderTaskSuggestions();
        }

        function addTaskFromSuggestion(title) {
            if (activeProductForSuggestions !== null) {
                addTask(activeProductForSuggestions, title);
            } else {
                alert("Bitte wählen Sie zuerst ein Produkt aus, dem Sie eine Aufgabe hinzufügen möchten.");
            }
        }

        function updateProduct(productIndex, field, value) {
            products[productIndex][field] = value;
            renderProducts();
        }

        function updateTask(productIndex, taskIndex, field, value) {
            products[productIndex].tasks[taskIndex][field] = value;
            renderProducts();
        }

        function addProduct() {
            products.push({
                name: "Neues Produkt",
                icon: "🏃",
                eta: "TBD",
                chargennummer: "",
                tasks: [{ title: "Neue Aufgabe", description: "", status: "pending" }]
            });
            renderProducts();
        }

        function addProductFromTemplate() {
            const selector = document.getElementById('templateSelector');
            const templateKey = selector.value;
            if (templateKey && taskTemplates[templateKey]) {
                // Deep copy the template to avoid modifying the original
                const newProduct = JSON.parse(JSON.stringify(taskTemplates[templateKey]));
                products.push(newProduct);
                renderProducts();
            }
        }

        function populateTemplateSelector() {
            const selector = document.getElementById('templateSelector');
            selector.innerHTML = Object.keys(taskTemplates).map(key =>
                `<option value="${key}">${key}</option>`
            ).join('');
        }

        function deleteProduct(productIndex) {
            if (confirm('Produkt wirklich löschen?')) {
                products.splice(productIndex, 1);
                renderProducts();
            }
        }

        function addTask(productIndex, title = "Neue Aufgabe") {
            products[productIndex].tasks.push({
                title: title,
                description: "",
                status: "pending"
            });
            renderProducts();
        }

        function deleteTask(productIndex, taskIndex) {
            if (confirm('Aufgabe wirklich löschen?')) {
                products[productIndex].tasks.splice(taskIndex, 1);
                renderProducts();
            }
        }

        function exportConfig() {
            const config = `const productData = ${JSON.stringify({
                reportDate: new Date().toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                products: products
            }, null, 2)};`;
            
            const blob = new Blob([config], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tagesbericht-config.js';
            a.click();
        }

        function exportToOutlook() {
            const reportDate = new Date().toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const createProductHtml = product => {
                const progress = calculateProgress(product.tasks);
                const isCompleted = progress === 100;
                const icon = isCompleted ? '😴' : product.icon;
                const progressBarHtml = `
                    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #dee2e6; border-radius: 5px;">
                        <tr>
                            <td width="${progress}%" style="background-color: #8cc63f; border-radius: 5px; height: 10px;"></td>
                            <td width="${100 - progress}%"></td>
                        </tr>
                    </table>
                `;

                return `

                                        return `

                                                </td>
                                            </tr>
                                        `
                                    }).join('')}
                                </table>
                            </td>
                        </tr>
