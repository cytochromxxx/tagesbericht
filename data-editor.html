<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagesbericht Editor - Live Vorschau</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#8cc63f",
              "background-light": "#ffffff",
              "background-dark": "#333333",
              "surface-light": "#f8f8f8",
              "surface-dark": "#4a4a4a",
              "text-light-primary": "#333333",
              "text-dark-primary": "#f0f0f0",
              "text-light-secondary": "#666666",
              "text-dark-secondary": "#b0b0b0",
              "border-light": "#e0e0e0",
              "border-dark": "#5a5a5a",
            },
            fontFamily: {
              sans: ["Open Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
            },
          },
        },
      };
    </script>
    <style>
        .progress-bar {
            height: 100%;
            background-color: #8cc63f;
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body class="font-sans bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary">
    <div class="fixed top-4 right-4 z-50 space-x-2">
        <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors" onclick="toggleMode()" id="modeBtn">✏️ Bearbeiten</button>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors" onclick="exportData()">💾 Export</button>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-6 md:p-8">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 pb-4 border-b border-border-light dark:border-border-dark">
            <div class="flex items-center space-x-4 mb-4 sm:mb-0">
                <img alt="Minerva Biolabs Logo" class="h-16 w-auto" src="https://minerva-biolabs.com/img/mb_logo.svg"/>
                <div>
                    <p class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Täglicher Arbeitsbericht - Editor</p>
                </div>
            </div>
            <div class="text-right">
                <p class="font-semibold text-lg" id="reportDate">Heute</p>
                <p class="text-text-light-secondary dark:text-text-dark-secondary">Flo Produktion</p>
            </div>
        </header>

        <section class="mb-8">
            <h2 class="text-xl font-bold mb-4 pb-2 border-b border-border-light dark:border-border-dark flex items-center">
                <span class="material-icons mr-2 text-primary">analytics</span>
                Prozess-Übersicht
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="totalProducts">0</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Aktive Prozesse</div>
                </div>
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="completedTasks">0</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Abgeschlossen</div>
                </div>
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="totalTasks">0</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Gesamt Aufgaben</div>
                </div>
                <div class="bg-surface-light dark:bg-surface-dark p-4 rounded-lg border border-border-light dark:border-border-dark text-center">
                    <div class="text-2xl font-bold text-primary" id="avgProgress">0%</div>
                    <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">Ø Fortschritt</div>
                </div>
            </div>
        </section>

        <main>
            <section class="mb-8">
                <h2 class="text-xl font-bold mb-4 pb-2 border-b border-border-light dark:border-border-dark flex items-center">
                    <span class="material-icons mr-2 text-orange-500">settings</span>
                    Produktfortschritt
                </h2>
                <div id="products-container"></div>
                
                <div class="text-center mt-6" id="addProductSection" style="display: none;">
                    <button class="bg-primary text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors" onclick="addProduct()">
                        <span class="material-icons mr-2">add</span>Neues Produkt hinzufügen
                    </button>
                </div>
            </section>
        </main>


    </div>

    <script>
        let editMode = false;
        let products = [
            {
                name: "Venor® Mycoplasma qPCR",
                icon: "🏃",
                eta: "Morgen",
                tasks: [
                    { title: "Mix", description: "", status: "completed" },
                    { title: "IK", description: "", status: "completed" },
                    { title: "PK", description: "", status: "completed" },
                    { title: "Wasser", description: "", status: "completed" },
                    { title: "Qualitätskontrolle", description: "bestanden: 02.12.2025", status: "completed" },
                    { title: "Labeling", description: "", status: "completed" },
                    { title: "Packing", description: "", status: "completed" },
                    { title: "Dokumente schicki + Freigabe", description: "", status: "completed" },
                    { title: "Abgabe Lager (Prozessende)", description: "", status: "completed" }
                ]
            },
            {
                name: "QIAcuity E.coli resDNA Kit",
                icon: "🏃",
                eta: "TBD",
                tasks: [
                    { title: "Mix", description: "Warten auf Lieferung", status: "in-progress" },
                    { title: "IK", description: "", status: "completed" },
                    { title: "PK", description: "", status: "completed" },
                    { title: "Wasser", description: "", status: "completed" },
                    { title: "Qualitätskontrolle", description: "", status: "pending" },
                    { title: "Labeling", description: "", status: "pending" },
                    { title: "Packing", description: "", status: "pending" },
                    { title: "Dokumente schicki + Freigabe", description: "", status: "pending" },
                    { title: "Abgabe Lager (Prozessende)", description: "", status: "pending" }
                ]
            },
            {
                name: "Mynox® Gold",
                icon: "🏃",
                eta: "TBD",
                tasks: [
                    { title: "Herstellung", description: "", status: "completed" },
                    { title: "Qualitätskontrolle", description: "QK bestanden", status: "completed" },
                    { title: "keine neuen Abfüllungen aus dieser Charge", description: "", status: "pending" }
                ]
            }
        ];

        function calculateProgress(tasks) {
            if (tasks.length === 0) return 0;
            const completed = tasks.filter(task => task.status === 'completed').length;
            return Math.round((completed / tasks.length) * 100);
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'completed': return 'check_circle';
                case 'in-progress': return 'schedule';
                case 'pending': return 'radio_button_unchecked';
                default: return 'radio_button_unchecked';
            }
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'completed': return 'text-primary';
                case 'in-progress': return 'text-yellow-500';
                case 'pending': return 'text-text-light-secondary dark:text-text-dark-secondary';
                default: return 'text-text-light-secondary dark:text-text-dark-secondary';
            }
        }

        function updateStats() {
            const totalProducts = products.length;
            const completedTasks = products.reduce((sum, product) => 
                sum + product.tasks.filter(task => task.status === 'completed').length, 0
            );
            const totalTasks = products.reduce((sum, product) => sum + product.tasks.length, 0);
            const avgProgress = totalProducts > 0 ? Math.round(products.reduce((sum, product) => 
                sum + calculateProgress(product.tasks), 0) / totalProducts) : 0;
            
            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('completedTasks').textContent = completedTasks;
            document.getElementById('totalTasks').textContent = totalTasks;
            document.getElementById('avgProgress').textContent = avgProgress + '%';
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map((product, productIndex) => {
                const progress = calculateProgress(product.tasks);
                return `
                    <div class="bg-surface-light dark:bg-surface-dark p-6 rounded-lg border border-border-light dark:border-border-dark shadow-sm mb-6 ${editMode ? 'ring-2 ring-primary ring-opacity-50' : ''}">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                ${editMode ? `<input class="w-12 h-8 text-center text-xl border border-border-light rounded" value="${product.icon}" onchange="updateProduct(${productIndex}, 'icon', this.value)">` : `<span class="text-2xl">${product.icon}</span>`}
                                ${editMode ? `<input class="font-semibold text-lg bg-transparent border-b border-primary" value="${product.name}" onchange="updateProduct(${productIndex}, 'name', this.value)">` : `<h3 class="font-semibold text-lg">${product.name}</h3>`}
                            </div>
                            <div class="text-right">
                                <span class="text-sm font-bold text-primary">${progress}%</span>
                                <div class="text-xs text-text-light-secondary dark:text-text-dark-secondary">
                                    Lieferdatum: ${editMode ? `<input class="w-20 text-xs bg-transparent border-b border-primary" value="${product.eta}" onchange="updateProduct(${productIndex}, 'eta', this.value)">` : product.eta}
                                </div>
                            </div>
                        </div>
                        
                        <div class="w-full bg-border-light dark:bg-border-dark rounded-full h-2.5 mb-4">
                            <div class="progress-bar h-2.5 rounded-full" style="width: ${progress}%"></div>
                        </div>
                        
                        <div class="space-y-1">
                            ${product.tasks.map((task, taskIndex) => `
                                <div class="flex items-start p-2 bg-background-light dark:bg-background-dark rounded border border-border-light dark:border-border-dark ${editMode ? 'ring-1 ring-primary ring-opacity-30' : ''} ${task.status === 'pending' && !editMode ? 'opacity-60' : ''}">
                                    <span class="material-icons ${getStatusClass(task.status)} mr-2 mt-0.5 text-sm">${getStatusIcon(task.status)}</span>
                                    <div class="flex-1">
                                        ${editMode ? `<input class="font-medium text-sm w-full bg-transparent border-b border-primary mb-1" value="${task.title}" onchange="updateTask(${productIndex}, ${taskIndex}, 'title', this.value)">` : `<p class="font-medium text-sm ${task.status === 'pending' ? 'text-gray-500' : ''}">${task.title}</p>`}
                                        ${task.description && task.description.trim() !== '' && task.description !== 'Beschreibung' && !editMode ? `<p class="text-xs text-text-light-secondary dark:text-text-dark-secondary ${task.status === 'pending' ? 'text-gray-400' : ''}">${task.description}</p>` : ''}
                                        ${editMode ? `<input class="text-xs text-text-light-secondary dark:text-text-dark-secondary w-full bg-transparent border-b border-gray-300" value="${task.description || ''}" onchange="updateTask(${productIndex}, ${taskIndex}, 'description', this.value)" placeholder="Beschreibung (optional)">` : ''}
                                        ${editMode ? `
                                            <select class="mt-1 text-xs border border-border-light rounded px-2 py-1" onchange="updateTask(${productIndex}, ${taskIndex}, 'status', this.value)">
                                                <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Geplant</option>
                                                <option value="in-progress" ${task.status === 'in-progress' ? 'selected' : ''}>In Arbeit</option>
                                                <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Fertig</option>
                                            </select>
                                        ` : ''}
                                    </div>
                                    ${editMode ? `
                                        <button class="ml-2 text-red-500 hover:text-red-700" onclick="deleteTask(${productIndex}, ${taskIndex})">
                                            <span class="material-icons text-sm">delete</span>
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                            ${editMode ? `
                                <div class="flex space-x-2 mt-4">
                                    <button class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-green-600" onclick="addTask(${productIndex})">
                                        <span class="material-icons text-sm mr-1">add</span>Aufgabe
                                    </button>
                                    <button class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600" onclick="deleteProduct(${productIndex})">
                                        <span class="material-icons text-sm mr-1">delete</span>Produkt löschen
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            updateStats();
        }

        function toggleMode() {
            editMode = !editMode;
            document.getElementById('modeBtn').textContent = editMode ? '👁️ Vorschau' : '✏️ Bearbeiten';
            document.getElementById('addProductSection').style.display = editMode ? 'block' : 'none';
            renderProducts();
        }

        function updateProduct(productIndex, field, value) {
            products[productIndex][field] = value;
            renderProducts();
        }

        function updateTask(productIndex, taskIndex, field, value) {
            products[productIndex].tasks[taskIndex][field] = value;
            renderProducts();
        }

        function addProduct() {
            products.push({
                name: "Neues Produkt",
                icon: "🏃",
                eta: "TBD",
                tasks: [{ title: "Neue Aufgabe", description: "Beschreibung", status: "pending" }]
            });
            renderProducts();
        }

        function deleteProduct(productIndex) {
            if (confirm('Produkt wirklich löschen?')) {
                products.splice(productIndex, 1);
                renderProducts();
            }
        }

        function addTask(productIndex) {
            products[productIndex].tasks.push({
                title: "Neue Aufgabe",
                description: "Beschreibung",
                status: "pending"
            });
            renderProducts();
        }

        function deleteTask(productIndex, taskIndex) {
            if (confirm('Aufgabe wirklich löschen?')) {
                products[productIndex].tasks.splice(taskIndex, 1);
                renderProducts();
            }
        }

        function exportData() {
            const config = `const productData = ${JSON.stringify({
                reportDate: new Date().toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                products: products
            }, null, 2)};`;
            
            const blob = new Blob([config], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tagesbericht-config.js';
            a.click();
        }

        // Initialisierung
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('reportDate').textContent = new Date().toLocaleDateString('de-DE', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });

            renderProducts();
        });
    </script>
</body>
</html>
